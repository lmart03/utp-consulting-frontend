<app-dashboard-header
  [userName]="user()?.name ?? null"
  [userEmail]="user()?.email ?? store.connectedAccount()"
  [systemActive]="store.systemActive()"
  [connection]="store.connection()"
  (logout)="logout()"
/>

<main class="mx-auto flex max-w-7xl flex-col gap-6 px-4 py-8 sm:gap-8 sm:px-6 sm:py-10 lg:px-8">
  <!-- Bienvenida -->
  <section class="flex flex-wrap items-end justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Panel de automatización</h1>
      <p class="mt-1 text-sm text-slate-500">Supervisa en tiempo real el procesamiento inteligente de correos.</p>
    </div>
    @if (lastUpdatedText()) {
      <p class="text-xs text-slate-400">
        Última actualización: <span class="tabular-nums text-slate-500">{{ lastUpdatedText() }}</span>
      </p>
    }
  </section>

  @if (store.error(); as error) {
    <div class="flex animate-fade-in items-center justify-between gap-3 rounded-xl border border-red-100 bg-red-50/70 px-4 py-3 text-sm text-red-700">
      <span class="flex items-center gap-2">
        <lucide-icon [img]="alertIcon" class="size-4 shrink-0" />
        {{ error }}
      </span>
      <button
        type="button"
        (click)="store.load()"
        class="inline-flex shrink-0 items-center gap-1.5 rounded-lg px-2.5 py-1 text-xs font-medium transition-colors duration-200 hover:bg-red-100"
      >
        <lucide-icon [img]="refreshIcon" class="size-3.5" />
        Reintentar
      </button>
    </div>
  }

  <!-- KPIs -->
  @if (store.loading()) {
    <div class="grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-4">
      @for (n of [1, 2, 3, 4]; track n) {
        <div class="h-[118px] animate-pulse rounded-2xl border border-slate-200 bg-white p-5">
          <div class="h-3 w-24 rounded bg-slate-200"></div>
          <div class="mt-4 h-7 w-12 rounded bg-slate-200"></div>
          <div class="mt-3 h-2.5 w-20 rounded bg-slate-200"></div>
        </div>
      }
    </div>
  } @else {
    <app-stats-cards [kpis]="store.kpis()" />
  }

  <!-- Pipeline en tiempo real (foco principal) -->
  <app-automation-pipeline [process]="store.activeProcess()" [loading]="store.loading()" />

  <!-- Actividad + Integraciones -->
  <div class="grid gap-6 sm:gap-8 lg:grid-cols-3">
    <div class="lg:col-span-2">
      <app-activity-timeline [items]="store.activeProcess()?.timeline ?? []" />
    </div>
    <app-integrations-status [integrations]="store.integrations()" />
  </div>

  <!-- Historial -->
  <app-recent-emails-table
    [emails]="store.emails()"
    [loading]="store.loading()"
    [selectedId]="store.selectedEmail()?.id ?? null"
    (selectEmail)="store.openDetail($event)"
  />
</main>

<app-email-detail-drawer
  [open]="store.drawerOpen()"
  [process]="store.selectedProcess()"
  [email]="store.selectedEmail()"
  [loading]="store.detailLoading()"
  (closed)="store.closeDetail()"
/>
