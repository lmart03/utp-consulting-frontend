<main class="flex min-h-dvh items-center justify-center bg-white px-4 py-12">
  <div class="w-full max-w-sm animate-fade-in-up text-center">
    <div class="mx-auto flex size-12 items-center justify-center rounded-2xl bg-emerald-500 text-white shadow-sm">
      <lucide-icon [img]="logoIcon" class="size-6" />
    </div>

    <h1 class="mt-6 text-2xl font-semibold tracking-tight text-slate-900">UTP Assistant</h1>
    <p class="mt-2 text-sm leading-6 text-slate-500">
      Automatiza tus correos y tareas con inteligencia artificial.
    </p>

    <button
      type="button"
      (click)="continueWithGoogle()"
      [disabled]="redirecting()"
      class="mt-8 inline-flex w-full items-center justify-center gap-3 rounded-xl bg-emerald-600 px-4 py-3 text-sm font-medium text-white shadow-sm transition-all duration-200 ease-out hover:-translate-y-px hover:bg-emerald-500 hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600 disabled:translate-y-0 disabled:opacity-70"
    >
      <span class="flex size-5 items-center justify-center rounded-full bg-white">
        <svg viewBox="0 0 24 24" class="size-3.5" aria-hidden="true">
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z" />
          <path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.7-4.9h-4v3.1A12 12 0 0 0 12 24z" />
          <path fill="#FBBC05" d="M5.3 14.4a7.2 7.2 0 0 1 0-4.7V6.6h-4a12 12 0 0 0 0 10.9l4-3.1z" />
          <path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8z" />
        </svg>
      </span>
      {{ redirecting() ? 'Redirigiendo a Google…' : 'Continuar con Google' }}
    </button>

    <div class="mt-10 flex flex-wrap items-center justify-center gap-2">
      @for (item of integrations; track item.label) {
        <span class="inline-flex items-center gap-1.5 rounded-full border border-slate-200 px-3 py-1 text-xs text-slate-500">
          <lucide-icon [img]="item.icon" class="size-3.5" />
          {{ item.label }}
        </span>
      }
    </div>
    <p class="mt-4 text-xs text-slate-400">Se solicitará acceso a Gmail y Google Calendar de tu cuenta.</p>
  </div>
</main>
